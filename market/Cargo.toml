[package]
name = "nearmiss-market"
version = "1.0.0"
edition = "2021"
description = "NEARMISS market: fixed-price listings and escrowed offers for NEP-171 collections, NEP-199 payouts"
repository = "https://github.com/nearmissdev/nearmiss-contracts"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing", "legacy"] }

[dev-dependencies.near-workspaces]
version = "0.22"
features = ["unstable"]

[dev-dependencies.tokio]
version = "1"
features = ["full"]

[dev-dependencies.serde_json]
version = "1"

[dev-dependencies.anyhow]
version = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
